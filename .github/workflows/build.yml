# Builds every plugin bundle, tests it, and publishes:
#   - pushes to main  -> GitHub Pages site with download links and UI demos
#   - tags "v*"       -> a GitHub Release with the bundles attached
# (Pages must be enabled once: repo Settings -> Pages -> Source: "GitHub Actions")
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # creating releases
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  WASI_SDK_VERSION: '34'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install WASI-SDK, Ninja
        run: |
          curl -sSL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux" >> "$GITHUB_ENV"
          sudo apt-get install -y --no-install-recommends ninja-build
          cmake --version

      - name: Build
        run: |
          cmake --preset wasm
          cmake --build --preset wasm

      - name: Test
        run: |
          for bundle in dist/*.wclap.tar.gz; do
            node tests/smoke-test.mjs "$bundle"
          done

      - name: Assemble site
        env:
          SITE_PLUGINS: console-eq # plugins/<name> shown on the site (bundle: dist/<name>.wclap.tar.gz)
        run: |
          mkdir -p site/download site/demo
          cp -r web/* site/
          for plugin in $SITE_PLUGINS; do
            cp "dist/$plugin.wclap.tar.gz" site/download/
            mkdir -p "site/demo/$plugin"
            cp -r "plugins/$plugin/ui"/* "site/demo/$plugin/"
            # Screenshot of the UI (in demo mode, with the settings from plugins/<name>/screenshot-settings)
            if [ -f "plugins/$plugin/screenshot-settings" ]; then
              google-chrome --headless=new --disable-gpu --hide-scrollbars --force-device-scale-factor=2 --window-size=640,420                 --screenshot="$PWD/site/$plugin.png" "file://$PWD/plugins/$plugin/ui/index.html#$(cat "plugins/$plugin/screenshot-settings")"
            fi
          done
          ls -R site

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.wclap.tar.gz --title "$GITHUB_REF_NAME" --generate-notes

  pages:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
